name: IBS microbiome analysis

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "docs/**"
      - "metadata/**"
      - "README.md"
      - ".github/workflows/ibs-microbiome.yml"
  workflow_dispatch:

concurrency:
  group: ibs-microbiome-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell and Python syntax
        run: |
          bash -n scripts/01_prepare_metadata.sh
          bash -n scripts/02_run_ibs_analysis.sh
          python -m py_compile scripts/03_build_results.py
      - name: Check source snapshot and project documentation
        run: |
          test -s results/REPORT.md
          test -s results/qc/table/feature-table.biom
          test -s results/qc/taxonomy/taxonomy.tsv
          test -s results/tables/alpha_diversity.tsv
          test -s results/ml/cross_validation_metrics.tsv
          test -s docs/DATA_PROVENANCE.md
          test -s docs/WORKFLOW.md

  analyze:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Pull QIIME 2
        run: docker pull quay.io/qiime2/amplicon:2024.10
      - name: Run public IBS analysis
        run: bash scripts/02_run_ibs_analysis.sh
      - name: Upload verified results
        uses: actions/upload-artifact@v4
        with:
          name: project02-ibs-results
          path: results_actual/
          if-no-files-found: error
          retention-days: 90
